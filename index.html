<!doctype html>
<html lang="en">
  
  <head>
    <script>
      window.onerror = (event) => {
        localStorage.setItem("unhandled_event", event)
      }

      window.sentryOnLoad = () => {
        const unhandled_event = localStorage.getItem("unhandled_event")
        Sentry.captureException(unhandled_event)
        localStorage.clear()
      }
    </script> 
    <script src="https://js.sentry-cdn.com/d92f7477aa04e5f9a7416ca443a90682.min.js" crossorigin="anonymous"></script>
    <script
      src="/src/SentryOptions.js"
    ></script>
    <script> throw new Error('Error before Sentry')</script>
    <script>
      Sentry.init({
        dsn: DSN,
        //integrations: [Sentry.captureConsoleIntegration()],
        environment: "sergio-test-env",
        replaysSessionSampleRate: SessionReplayOptions.sessionSampleRate,
        replaysOnErrorSampleRate: SessionReplayOptions.errorSampleRate,
        beforeSend: (event) => {
          const user = retrieveUserIfLoggedIn();
          if (user !== null) {
            console.log(user)
            Sentry.setUser({
              email: user.email
            })
          }
          return event
        }
      });

      const retrieveUserIfLoggedIn = () => {
        return {
          "email" : "test@example.com",
          "locale" : "United States"
        }
      }
    </script>
    <script>
      setTimeout( () => {
        throw new Error("Error After Initialization")
      }, 4000)
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body>\
    <div id="app"></div>
    <script type="module" src="src/main.js"></script>
  </body>

    
  
</html>
